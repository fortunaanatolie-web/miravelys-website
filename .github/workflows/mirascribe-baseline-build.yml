name: MiraScribe Baseline Build

on:
  pull_request:
    paths:
      - 'src/pages/mirascribe/**'
      - 'src/styles/site-mirascribe*.css'
      - 'src/main.jsx'
      - 'public/images/mirascribe/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mirascribe-baseline-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender public routes
        run: npm run build

      - name: Verify public contract
        run: npm run verify:public-contract
