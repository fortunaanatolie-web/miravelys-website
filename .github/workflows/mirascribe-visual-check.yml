name: Premium Ecosystem Visual Check

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public-site/identities/**'
      - 'public-site/images/**'
      - 'scripts/prerender_public_routes.mjs'
      - 'scripts/verify_public_contract.mjs'
      - 'scripts/verify_product_identity_prerender.mjs'
      - 'scripts/verify_mirascribe_visual_contract.mjs'
      - 'scripts/verify_premium_ecosystem.mjs'
      - 'scripts/verify_premium_accessibility.mjs'
      - 'scripts/verify_live_production.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mirascribe-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender public routes
        run: npm run build

      - name: Verify public contract
        run: npm run verify:public-contract

      - name: Verify prerendered product identity
        run: node scripts/verify_product_identity_prerender.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mira-preview.log 2>&1 &
          echo $! > /tmp/mira-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mira-preview.log
          exit 1

      - name: Verify MiraScribe rendered contract
        run: node scripts/verify_mirascribe_visual_contract.mjs

      - name: Verify premium ecosystem responsive contract
        run: node scripts/verify_premium_ecosystem.mjs

      - name: Verify premium accessibility contract
        run: node scripts/verify_premium_accessibility.mjs

      - name: Verify live production domain
        env:
          LIVE_BASE_URL: https://www.miravelys.com
        run: node scripts/verify_live_production.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-ecosystem-visual-evidence
          path: |
            artifacts/mirascribe-visual-contract/
            artifacts/premium-ecosystem/
            artifacts/live-production-verification/
          if-no-files-found: ignore
          retention-days: 14
