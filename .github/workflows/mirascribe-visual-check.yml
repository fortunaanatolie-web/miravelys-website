name: MiraScribe Visual Branch Check

on:
  pull_request:
    paths:
      - 'src/pages/mirascribe/**'
      - 'src/styles/site-mirascribe*.css'
      - 'src/main.jsx'
      - 'public/images/mirascribe/**'
      - 'public-site/images/mirascribe/**'
      - 'scripts/verify_mirascribe_visual_contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mirascribe-visual-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender public routes
        run: npm run build

      - name: Verify public contract
        run: npm run verify:public-contract

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/mirascribe-preview.log 2>&1 &
          echo $! > /tmp/mirascribe-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/mirascribe > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mirascribe-preview.log
          exit 1

      - name: Verify rendered visual contract
        run: node scripts/verify_mirascribe_visual_contract.mjs

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirascribe-visual-contract
          path: artifacts/mirascribe-visual-contract/
          if-no-files-found: ignore
          retention-days: 14
